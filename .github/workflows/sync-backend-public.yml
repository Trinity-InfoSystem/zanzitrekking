name: Sync Backend Public Folder from cPanel

on:
  workflow_dispatch:
    inputs:
      sync_direction:
        description: 'Sync direction'
        required: true
        default: 'pull'
        type: choice
        options:
          - pull
          - push

jobs:
  sync-public:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Public Folder from cPanel (SSH)
        if: ${{ github.event.inputs.sync_direction == 'pull' }}
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          source: "/home/safariszanzico/api.zanzisafaris.com/public/*"
          target: "./zanzitrekking-backend/"
          strip_components: 3

      - name: Check if SSH Pull Succeeded
        if: ${{ github.event.inputs.sync_direction == 'pull' }}
        run: |
          if [ ! -d "zanzitrekking-backend/public/uploads" ] && [ -z "${{ secrets.CPANEL_SSH_HOST }}" ]; then
            echo "⚠️ SSH secrets not configured. Using manual FTP instructions."
            echo ""
            echo "To sync manually via FTP:"
            echo "1. Use FTP client (FileZilla, WinSCP, etc.)"
            echo "2. Connect to: ${{ secrets.CPANEL_FTP_HOST }}"
            echo "3. Username: ${{ secrets.CPANEL_FTP_USERNAME }}"
            echo "4. Download: /api.zanzisafaris.com/public/ to C:\Users\ali\Desktop\Deployment\zanzitrekking-backend\public\"
            echo "5. Then commit: git add zanzitrekking-backend/public/ && git commit -m 'Sync public folder' && git push"
            echo ""
            echo "Or configure SSH secrets for automatic sync."
            exit 1
          fi

      - name: Commit and Push Changes (Pull Mode)
        if: ${{ github.event.inputs.sync_direction == 'pull' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Force add public folder (even if in .gitignore)
          git add -f zanzitrekking-backend/public/
          git diff --staged --quiet || git commit -m "Sync: Pull latest public folder from cPanel [skip ci]"
          git push

      - name: Push Public Folder to cPanel (FTP)
        if: ${{ github.event.inputs.sync_direction == 'push' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./zanzitrekking-backend/public/
          server-dir: /api.zanzisafaris.com/public/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.DS_Store
            **/.gitkeep

      - name: Push Public Folder to cPanel (SSH)
        if: ${{ github.event.inputs.sync_direction == 'push' && secrets.CPANEL_SSH_HOST != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          source: "./zanzitrekking-backend/public/*"
          target: "/home/safariszanzico/api.zanzisafaris.com/"
          strip_components: 2

      - name: Sync Notification
        run: |
          if [ "${{ github.event.inputs.sync_direction }}" == "pull" ]; then
            echo "✅ Public folder pulled from cPanel and committed to repository"
          else
            echo "✅ Public folder pushed to cPanel"
          fi
