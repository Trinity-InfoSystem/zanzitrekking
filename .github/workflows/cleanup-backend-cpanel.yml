name: Cleanup Backend on cPanel (Delete All Except Public)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DELETE" to confirm cleanup'
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    
    steps:
      - name: Cleanup Backend on cPanel (SSH)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            cd /home/safariszanzico/api.zanzisafaris.com
            
            # Backup public folder temporarily
            if [ -d "public" ]; then
              echo "Backing up public folder..."
              cp -r public public_backup_$(date +%Y%m%d_%H%M%S)
            fi
            
            # Remove everything except public folder
            echo "Removing all files and folders except public..."
            find . -maxdepth 1 ! -name '.' ! -name 'public' ! -name 'public_backup_*' -exec rm -rf {} +
            
            # Restore public folder if backup exists
            if [ -d public_backup_* ]; then
              LATEST_BACKUP=$(ls -td public_backup_* | head -1)
              if [ -d "$LATEST_BACKUP" ]; then
                rm -rf public
                mv "$LATEST_BACKUP" public
                echo "Public folder restored"
              fi
            fi
            
            echo "✅ Cleanup complete. Only public folder remains."

      - name: Cleanup Notification
        run: |
          echo "⚠️ Note: If SSH cleanup failed, manual cleanup required via FTP/File Manager."
          echo ""
          echo "Manual Steps:"
          echo "1. Log into cPanel File Manager"
          echo "2. Navigate to /home/safariszanzico/api.zanzisafaris.com/"
          echo "3. Select all files and folders EXCEPT 'public'"
          echo "4. Delete selected items"
          echo "5. Verify only 'public' folder remains"
