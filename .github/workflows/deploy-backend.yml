name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'zanzitrekking-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: zanzitrekking-backend/package-lock.json

      - name: Prepare files for deployment
        working-directory: ./zanzitrekking-backend
        run: |
          # Remove node_modules to reduce size (dependencies installed manually on server)
          rm -rf node_modules
          echo "✅ Files prepared for deployment"

      - name: Check FTP Secrets
        run: |
          if [ -z "${{ secrets.CPANEL_FTP_HOST }}" ] || [ -z "${{ secrets.CPANEL_FTP_USERNAME }}" ] || [ -z "${{ secrets.CPANEL_FTP_PASSWORD }}" ]; then
            echo "❌ ERROR: FTP secrets are missing!"
            echo "Please configure these secrets in GitHub:"
            echo "  - CPANEL_FTP_HOST"
            echo "  - CPANEL_FTP_USERNAME"
            echo "  - CPANEL_FTP_PASSWORD"
            echo ""
            echo "Go to: Settings → Secrets and variables → Actions"
            exit 1
          else
            echo "✅ FTP secrets are configured"
          fi

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./zanzitrekking-backend/
          server-dir: ./api.zanzisafaris.com/
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.log
            **/dist
            **/.DS_Store
            **/public/**
            **/public/uploads/**
            **/public/pdfs/**
            **/public/newsletter/**

      - name: Deployment Notification
        if: success()
        run: |
          echo "✅ Backend deployed successfully to cPanel"
