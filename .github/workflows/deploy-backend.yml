name: Deploy Backend

on:
  push:
    branches:
      - master
    paths:
      - 'zanzitrekking-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync files
        run: |
          rsync -avz --delete \
            --exclude ".git" \
            --exclude ".env" \
            --exclude "public" \
            --exclude "node_modules" \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            ./zanzitrekking-backend/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.BACKEND_DEPLOYMENT_DIR }}

      - name: Post-deployment commands
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.BACKEND_DEPLOYMENT_DIR }} && npm ci && pm2 startOrReload ecosystem.config.json --env production"
