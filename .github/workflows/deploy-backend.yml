name: Deploy Backend to cPanel

# This workflow triggers ONLY when backend files change
# It will NOT trigger if only frontend files are changed
on:
  push:
    branches:
      - main
    paths:
      - 'zanzitrekking-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.CPANEL_SSH_PORT || 22 }} ${{ secrets.CPANEL_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync files
        run: |
          rsync -avz --delete \
            --exclude ".git" \
            --exclude ".env" \
            --exclude "public" \
            --exclude "node_modules" \
            -e "ssh -p ${{ secrets.CPANEL_SSH_PORT || 22 }}" \
            ./ ${{ secrets.CPANEL_SSH_USERNAME }}@${{ secrets.CPANEL_SSH_HOST }}:${{ secrets.CPANEL_BACKEND_DEPLOYMENT_DIR }}
