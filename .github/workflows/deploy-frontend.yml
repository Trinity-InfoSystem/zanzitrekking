name: Deploy Frontend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'zanzitrekking-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify dist folder exists
        working-directory: ./zanzitrekking-frontend
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ ERROR: dist folder not found!"
            echo "Please build the frontend locally and commit the dist folder."
            exit 1
          fi
          echo "✅ Dist folder found"
          echo "📁 Contents of dist folder:"
          ls -la dist | head -20
          echo ""
          echo "📊 Total files: $(find dist -type f | wc -l)"

      - name: Check FTP Secrets
        run: |
          if [ -z "${{ secrets.CPANEL_FTP_HOST }}" ] || [ -z "${{ secrets.CPANEL_FTP_USERNAME }}" ] || [ -z "${{ secrets.CPANEL_FTP_PASSWORD }}" ]; then
            echo "❌ ERROR: FTP secrets are missing!"
            echo "Please configure these secrets in GitHub:"
            echo "  - CPANEL_FTP_HOST"
            echo "  - CPANEL_FTP_USERNAME"
            echo "  - CPANEL_FTP_PASSWORD"
            echo ""
            echo "Go to: Settings → Secrets and variables → Actions"
            exit 1
          else
            echo "✅ FTP secrets are configured"
          fi

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./zanzitrekking-frontend/dist/
          server-dir: ./booking.zanzisafaris.com/
          dry-run: false
          dangerous-clean-slate: true
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store

      - name: Deployment Notification
        if: success()
        run: |
          echo "✅ Frontend deployed successfully to cPanel"
