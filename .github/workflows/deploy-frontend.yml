name: Deploy Frontend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'zanzitrekking-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./zanzitrekking-frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./zanzitrekking-frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.zanzisafaris.com' }}
        run: npm run build

      - name: Verify build output
        working-directory: ./zanzitrekking-frontend
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ ERROR: dist folder not found after build!"
            exit 1
          fi
          echo "✅ Build output verified: $(ls -la dist | head -10)"

      - name: Check FTP Secrets
        run: |
          if [ -z "${{ secrets.CPANEL_FTP_HOST }}" ] || [ -z "${{ secrets.CPANEL_FTP_USERNAME }}" ] || [ -z "${{ secrets.CPANEL_FTP_PASSWORD }}" ]; then
            echo "❌ ERROR: FTP secrets are missing!"
            exit 1
          else
            echo "✅ FTP secrets are configured"
          fi

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./zanzitrekking-frontend/dist/
          server-dir: ./booking.zanzisafaris.com/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store

      - name: SSH Deploy (Alternative - if SSH is available)
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          source: "./zanzitrekking-frontend/dist/*"
          target: "/home/safariszanzico/booking.zanzisafaris.com/"

      - name: Deployment Notification
        if: success()
        run: |
          echo "✅ Frontend deployed successfully to cPanel"
