name: Deploy Dashboard

on:
  push:
    branches:
      - master
    paths:
      - 'zanzitrekking-dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./zanzitrekking-dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zanzitrekking-dashboard/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build -- --mode production

      - name: Verify artifact
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ ERROR: Missing build artifact!"
            echo "Dashboard build failed. Please check the build logs."
            exit 1
          fi
          echo "✅ App artifact built successfully"
          echo "📁 Contents of artifact:"
          ls -a dist | head -20
          echo ""
          echo "📊 Total files: $(find dist -type f | wc -l)"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync files
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DASHBOARD_DEPLOYMENT_DIR }}

      - name: Deployment Notification
        if: success()
        run: |
          echo "✅ Dashboard deployed successfully"
