name: Deploy Dashboard to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'zanzitrekking-dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./zanzitrekking-dashboard
        run: |
          echo "📦 Installing dependencies..."
          npm ci
          echo "✅ Dependencies installed"

      - name: Build dashboard
        working-directory: ./zanzitrekking-dashboard
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.zanzisafaris.com' }}
        run: |
          echo "🔨 Building dashboard..."
          npm run build
          echo "✅ Build completed"

      - name: Verify build output
        working-directory: ./zanzitrekking-dashboard
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ ERROR: dist folder not found after build!"
            exit 1
          fi
          echo "✅ Build output verified"
          echo "📁 Contents of dist folder:"
          ls -la dist | head -20
          echo ""
          echo "📊 Total files: $(find dist -type f | wc -l)"

      - name: Check FTP Secrets
        run: |
          if [ -z "${{ secrets.CPANEL_FTP_HOST }}" ] || [ -z "${{ secrets.CPANEL_FTP_USERNAME }}" ] || [ -z "${{ secrets.CPANEL_FTP_PASSWORD }}" ]; then
            echo "❌ ERROR: FTP secrets are missing!"
            echo "Please configure these secrets in GitHub:"
            echo "  - CPANEL_FTP_HOST"
            echo "  - CPANEL_FTP_USERNAME"
            echo "  - CPANEL_FTP_PASSWORD"
            echo ""
            echo "Go to: Settings → Secrets and variables → Actions"
            exit 1
          else
            echo "✅ FTP secrets are configured"
          fi

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./zanzitrekking-dashboard/dist/
          server-dir: ./admin.zanzisafaris.com/
          dry-run: false
          dangerous-clean-slate: true
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store

      - name: Deployment Notification
        if: success()
        run: |
          echo "✅ Dashboard deployed successfully to cPanel"
