<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- ✅ Preconnect to external domains for faster resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://connect.facebook.net" />
    <link rel="preconnect" href="https://embed.trustmary.com" />
    <link rel="preconnect" href="https://cdn.commoninja.com" />
    <link rel="dns-prefetch" href="https://api.safarioffice.com" />
    
    <!-- ✅ Resource hints for critical assets -->
    <link rel="preload" href="/images/newZanzi.jpg" as="image" type="image/jpeg" />
    <link rel="preload" href="/favicon/favicon-32x32.png" as="image" type="image/png" />
    
    <!-- ✅ Prefetch critical routes for faster navigation -->
    <link rel="prefetch" href="/trips" as="document" />
    <link rel="prefetch" href="/blog" as="document" />
    <link rel="prefetch" href="/about-us" as="document" />
    
    <!-- ✅ Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- ✅ Theme color for mobile browsers -->
    <meta name="theme-color" content="#475569" />
    
    <!-- ✅ Basic SEO (will be enhanced by React Helmet)
    <title>Zanzi Safaris - Tanzania Safari & Adventure Tours</title>
    <meta name="description" content="Experience unforgettable Tanzania safaris, Mount Kilimanjaro treks, and Zanzibar beach holidays with expert guides. Book your adventure today!" /> -->

    <!-- ✅ Defer non-critical scripts to improve initial load -->
    <script
      defer
      crossorigin="anonymous"
      src="https://connect.facebook.net/en_US/sdk.js"
    ></script>

  <body>
    <div id="root"></div>
    
    <!-- ✅ Main app script - highest priority -->
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- ✅ Defer non-critical third-party scripts -->
    <script
      src="https://cdn.commoninja.com/sdk/latest/commonninja.js"
      defer
    ></script>
